<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">W.A.G.E. Society logo mark</title>
  <desc id="desc">Circular gradient emblem with stylized W monogram in white</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="60%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#s)">
    <circle cx="256" cy="256" r="220" fill="url(#g)" />
  </g>

  <g transform="translate(0,0)" fill="#FFFFFF" stroke="none">
    <!-- Stylized W monogram -->
    <path d="M140 170 L188 342 L236 226 L285 342 L333 170 L296 170 L266 280 L236 170 L206 280 L176 170 Z" fill="#FFFFFF" opacity="0.98" transform="translate(28,12) scale(1.12)"/>
  </g>

</svg>
