name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install root dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Install mobile app dependencies
        working-directory: mobile/android-app
        run: npm ci

      - name: Copy web assets to mobile
        working-directory: mobile/android-app
        run: node ./scripts/copy-web-assets.mjs

      - name: Make Gradle wrapper executable
        working-directory: mobile/android-app/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: mobile/android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wage-society-debug-apk
          path: mobile/android-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Copy APK to public directory (for deployment)
        run: |
          cp mobile/android-app/android/app/build/outputs/apk/debug/app-debug.apk public/wage-society.apk

      - name: Upload public APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wage-society-public-apk
          path: public/wage-society.apk
          retention-days: 30
